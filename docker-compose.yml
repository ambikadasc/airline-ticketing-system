services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: airline
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
    ports:
      # Published on 5433 (loopback only) so a PostgreSQL already running on the host's 5432 does not
      # clash; the application reaches the database over the Compose network as db:5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/airline
      # Optional overrides of the airline.* settings in application.yml. Each is passed through only
      # when set in your shell or in a .env file, e.g. AIRLINE_BOOKING_WINDOW_DAYS=180 docker compose up
      AIRLINE_BOOKING_WINDOW_DAYS:
      AIRLINE_MAX_SEATS_PER_BOOKING:
      AIRLINE_INSTANCE_JOB_CRON:
      AIRLINE_RETRY_AFTER:
      AIRLINE_SEAT_HOLD_ENABLED:
      AIRLINE_SEAT_HOLD_TTL:
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
