server:
  port: 8080

spring:
  application:
    name: airline-reservation
  datasource:
    # The port docker-compose.yml publishes for the db service (not 5432, to avoid clashing with a
    # local PostgreSQL). Inside Compose the app gets SPRING_DATASOURCE_URL instead.
    url: jdbc:postgresql://localhost:5433/airline
    username: airline
    password: airline
    hikari:
      # Three numbers that bound how long a request can hold or wait for a database connection:
      #  - a write waits at most 3 s for a flight lock (while holding its connection)      -> 503 LOCK_TIMEOUT
      #  - a request waits at most 2 s for a pooled connection (never the 30 s default)    -> 503 RETRY_LATER
      #  - 10 connections in the pool (the default, made explicit)
      # Together they stop one busy flight from parking every request thread behind the pool.
      connection-init-sql: SET lock_timeout = '3s'
      connection-timeout: 2000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

logging:
  pattern:
    # Every log line carries the request id (set by RequestIdFilter); empty outside a request.
    level: "%5p [%X{requestId:-}]"

airline:
  booking-window-days: 365
  max-seats-per-booking: 9
  instance-job-cron: "0 5 0 * * *"
  # Retry-After sent with a 503 (LOCK_TIMEOUT, RETRY_LATER); pairs with lock_timeout above.
  retry-after: PT1S
  seat-hold:
    enabled: false
    ttl: PT10M
